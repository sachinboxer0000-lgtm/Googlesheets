
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sachin Study Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:20px;background:#172554;text-align:center}
h1{font-size:23px;margin:0 0 8px}
p{color:#b8c4da}
main{max-width:850px;margin:auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat,.book{background:#141c30;border:1px solid #2b3854;border-radius:12px}
.stat{padding:12px;text-align:center}
.stat strong{display:block;font-size:23px;color:#8bb5ff}
.stat span{font-size:12px;color:#b8c4da}
.progress{height:8px;background:#28334b;border-radius:10px;margin:15px 0;overflow:hidden}
#bar{height:100%;width:0;background:#69d6a5}
.controls{display:grid;gap:8px;margin-bottom:14px}
input,select,button{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#101a2e;color:white;font-size:14px}
button{background:#254579;font-weight:bold;cursor:pointer}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.book{margin-bottom:12px;overflow:hidden}
.bookhead{padding:13px;background:#1c2740;font-weight:bold}
.bookhead small{display:block;color:#aab4c8;margin-top:5px}
.chapter{padding:12px;border-top:1px solid #2b3854;display:grid;grid-template-columns:24px 1fr 105px;gap:8px;align-items:center}
.chapter input[type=checkbox]{width:19px;height:19px;accent-color:#69d6a5}
.chapter select{padding:7px;font-size:12px}
.title{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.done{color:#69d6a5;text-decoration:line-through}
.extra{grid-column:2/4;display:flex;gap:6px}
.extra button{padding:6px;font-size:12px}
.delete{background:#672c38}
#message{text-align:center;color:#69d6a5}
@media(min-width:600px){
.controls{grid-template-columns:1fr 1fr 1fr}
.buttons{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<header>
<h1>📚 Sachin Study Tracker</h1>
<p>RBSE कक्षा 12 | अपनी पढ़ाई का रिकॉर्ड रखो</p>
</header>

<main>
<div class="stats">
<div class="stat"><strong id="total">0</strong><span>कुल अध्याय</span></div>
<div class="stat"><strong id="completed">0</strong><span>पूरे हुए</span></div>
<div class="stat"><strong id="remaining">0</strong><span>बाकी</span></div>
</div>

<div class="progress"><div id="bar"></div></div>
<p id="summary">प्रगति: 0%</p>

<div class="controls">
<input id="search" placeholder="🔎 अध्याय खोजें...">

<select id="subjectFilter">
<option value="">सभी विषय</option>
</select>

<select id="statusFilter">
<option value="">सभी स्थितियाँ</option>
<option value="todo">बाकी</option>
<option value="doing">चल रहा है</option>
<option value="done">पूरा हुआ</option>
</select>

<div class="buttons">
<button onclick="exportTXT()">⬇ TXT Export</button>
<button onclick="addChapter()">＋ अध्याय जोड़ें</button>
<button onclick="backupJSON()">💾 बैकअप</button>
<button onclick="importJSON()">📂 बैकअप खोलें</button>
</div>
</div>

<p id="message"></p>
<div id="books"></div>
</main>

// अध्यायों के लिए अलग ID बनाना
function prepare(data){
 return data.map((b,i)=>({
  id:b.id||"book"+i,
  subject:b.subject,
  book:b.book,
  chapters:b.chapters.map((c,j)=>({
   id:c.id||"ch"+i+"_"+j,
   title:Array.isArray(c)?c[0]:c.title,
   status:Array.isArray(c)?c[1]:(c.status||"todo")
  }))
 }));
}

let books;
try{
 const saved=localStorage.getItem("sachinTracker12");
 books=saved?prepare(JSON.parse(saved)):prepare(initialData);
}catch(e){books=prepare(initialData);}

function save(){
 try{
  localStorage.setItem("sachinTracker12",JSON.stringify(books));
  document.getElementById("message").textContent="✅ प्रगति सेव हो गई";
 }catch(e){
  alert("डेटा सेव नहीं हो पाया। TXT/JSON बैकअप डाउनलोड करें।");
 }
 stats();
}

function allChapters(){
 return books.flatMap(b=>b.chapters);
}

function stats(){
 const all=allChapters();
 const done=all.filter(c=>c.status==="done").length;
 const doing=all.filter(c=>c.status==="doing").length;
 const total=all.length;
 const percent=total?Math.round(done/total*100):0;
 document.getElementById("total").textContent=total;
 document.getElementById("completed").textContent=done;
 document.getElementById("remaining").textContent=total-done;
 document.getElementById("bar").style.width=percent+"%";
 document.getElementById("summary").textContent=
 `प्रगति: ${percent}% | चल रहे: ${doing} | बाकी: ${total-done-doing}`;
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function render(){
 const subjectFilter=document.getElementById("subjectFilter");
 const previous=subjectFilter.value;
 const subjects=[...new Set(books.map(b=>b.subject))];
 subjectFilter.innerHTML='<option value="">सभी विषय</option>'+
 subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
 subjectFilter.value=previous;

 const query=document.getElementById("search").value.toLowerCase().trim();
 const subject=subjectFilter.value;
 const status=document.getElementById("statusFilter").value;
 let html="";

 books.forEach(b=>{
  if(subject && b.subject!==subject)return;
  const chapters=b.chapters.filter(c=>
   (!query||(c.title+" "+b.subject+" "+b.book).toLowerCase().includes(query))&&
   (!status||c.status===status)
  );
  if(!chapters.length)return;

  html+=`<section class="book">
  <div class="bookhead">${esc(b.subject)} — ${esc(b.book)}
  <small>${chapters.filter(c=>c.status==="done").length}/${chapters.length} पूरे</small>
  </div>`;

  chapters.forEach(c=>{
   html+=`<div class="chapter">
   <input type="checkbox" data-check="${c.id}"
   ${c.status==="done"?"checked":""} aria-label="पूरा हुआ">
   <div class="title ${c.status==="done"?"done":""}">${esc(c.title)}</div>
   <select data-status="${c.id}" aria-label="स्थिति">
   <option value="todo" ${c.status==="todo"?"selected":""}>बाकी</option>
   <option value="doing" ${c.status==="doing"?"selected":""}>चल रहा है</option>
   <option value="done" ${c.status==="done"?"selected":""}>पूरा</option>
   </select>
   <div class="extra">
   <button data-edit="${c.id}">✏️ नाम बदलें</button>
   <button class="delete" data-delete="${c.id}">हटाएँ</button>
   </div>
   </div>`;
  });
  html+="</section>";
 });

 document.getElementById("books").innerHTML=html||
 '<p>कोई अध्याय नहीं मिला। फ़िल्टर बदलकर देखें।</p>';
 stats();
}

function findChapter(id){
 for(const b of books){
  const c=b.chapters.find(c=>c.id===id);
  if(c)return {book:b,chapter:c};
 }
}

document.getElementById("books").addEventListener("change",e=>{
 const id=e.target.dataset.check||e.target.dataset.status;
 if(!id)return;
 const found=findChapter(id);
 if(!found)return;

 found.chapter.status=e.target.dataset.check?
  (e.target.checked?"done":"todo"):e.target.value;

 save();
 render();
});

document.getElementById("books").addEventListener("click",e=>{
 const edit=e.target.dataset.edit;
 if(edit){
  const found=findChapter(edit);
  if(!found)return;
  const title=prompt("अध्याय का नया नाम:",found.chapter.title);
  if(title&&title.trim()){
   found.chapter.title=title.trim();
   save();render();
  }
 }

 const del=e.target.dataset.delete;
 if(del&&confirm("क्या यह अध्याय हटाना है?")){
  books.forEach(b=>b.chapters=b.chapters.filter(c=>c.id!==del));
  save();render();
 }
});

document.getElementById("search").addEventListener("input",render);
document.getElementById("subjectFilter").addEventListener("change",render);
document.getElementById("statusFilter").addEventListener("change",render);

function addChapter(){
 const subject=prompt("विषय का नाम:");
 if(!subject||!subject.trim())return;

 const matching=books.find(b=>b.subject===subject.trim());
 const book=prompt("पुस्तक का नाम:",matching?matching.book:"नई पुस्तक");
 if(!book||!book.trim())return;

 const title=prompt("अध्याय का नाम:");
 if(!title||!title.trim())return;

 let b=books.find(b=>b.subject===subject.trim()&&b.book===book.trim());
 if(!b){
  b={id:"custom"+Date.now(),subject:subject.trim(),book:book.trim(),chapters:[]};
  books.push(b);
 }
 b.chapters.push({
  id:"chapter"+Date.now(),
  title:title.trim(),
  status:"todo"
 });
 save();render();
}

function downloadFile(content,name,type){
 const blob=new Blob(["\ufeff"+content],{type:type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function exportTXT(){
 const all=allChapters();
 const lines=[
 "SACHIN STUDY TRACKER — RBSE CLASS 12",
 "Export date: "+new Date().toLocaleDateString("hi-IN"),
 "",
 "कुल अध्याय: "+all.length,
 "पूरे हुए: "+all.filter(c=>c.status==="done").length,
 "चल रहे: "+all.filter(c=>c.status==="doing").length,
 "बाकी: "+all.filter(c=>c.status==="todo").length,
 ""
 ];

 books.forEach(b=>{
  lines.push("## "+b.subject+" — "+b.book);
  b.chapters.forEach((c,i)=>{
   const status=c.status==="done"?"पूरा पढ़ लिया":
    c.status==="doing"?"चल रहा है":"बाकी है";
   lines.push(`${i+1}. ${c.title} — ${status}`);
  });
  lines.push("");
 });

 downloadFile(lines.join("\n"),"sachin-study-progress.txt","text/plain;charset=utf-8");
}

function backupJSON(){
 downloadFile(JSON.stringify(books,null,2),
 "sachin-study-backup.json","application/json;charset=utf-8");
}

function importJSON(){
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json";
 input.onchange=async()=>{
  const file=input.files[0];
  if(!file)return;
  try{
   const parsed=JSON.parse(await file.text());
   if(!Array.isArray(parsed))throw Error("Invalid");
   if(!confirm("इससे वर्तमान सूची बदल जाएगी। पहले बैकअप कर लो। जारी रखें?"))return;
   books=prepare(parsed);
   save();render();
   alert("बैकअप सफलतापूर्वक खुल गया।");
  }catch(e){
   alert("यह सही JSON बैकअप फ़ाइल नहीं है।");
  }
 };
 input.click();
}

render();
</script>
